# Local supplement, NOT part of the signed upstream CRS release. Run before CRS's
# anomaly evaluation, after its score initialization (also for multiphase builds).
# Decode only for matching: never rewrite the request.
# ARGS already has one transport decoding layer. Two more passes cover nested
# escapes, with multiMatch checking the original and each transformed value.
# XML scalars use the same signatures. Ordinary prose/URLs alone are not attacks.

SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)[\x22'][\s)]*(?:or|and)[\s(]*[a-z_][a-z0-9_.:-]*\s*\(" "id:5006001,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'XPath predicate injection syntax',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx [\x22']\s*\]\s*\|\s*/|\|\s*//[^\s|]+\s*\|\s*//" "id:5006002,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'XPath union injection syntax',setvar:tx.inbound_anomaly_score_pl1=+5"

# Shell punctuation plus a command, rather than blocking punctuation by itself.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:[;|\n\r`]|&&|\$\()\s*(?:/[^\s;|`]*\/)?(?:i[\x22']*d|w[\x22']*h[\x22']*o[\x22']*a[\x22']*m[\x22']*i|uname|cat|curl|wget|bash|sh|powershell|pwsh|cmd(?:\.exe)?|nslookup|ping|sleep|printf|echo|ls|env|python[0-9.]*|perl|ruby|nc|netcat)(?:[\s;|`)&]|$)" "id:5006003,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Shell command chaining or substitution',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:^|[\s;|&])(?:cmd(?:\.exe)?\s+/[ck]\s|(?:powershell|pwsh)(?:\.exe)?\s+-(?:enc(?:odedcommand)?|command|c)\s)" "id:5006004,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Command interpreter invocation',setvar:tx.inbound_anomaly_score_pl1=+5"

SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:\{\{|[$#*]\{|<%=)[\s(]*(?:[0-9]+\s*[*+/\-]\s*[0-9]+|config\s*(?:\}\}|[.(])|[^\r\n]*(?:__class__|__globals__|__mro__|__subclasses__|getclass\s*\(|freemarker\.template\.utility\.Execute|java\.lang\.Runtime))" "id:5006005,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Server template expression injection',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:^|[/\\]|%(?:25)*(?:2f|5c))(?:\.|%(?:25)*2e){2}(?:[/\\]|%(?:25)*(?:2f|5c))" "id:5006006,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,multiMatch,severity:CRITICAL,msg:'Nested-encoded parent path traversal',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?:^|[^A-Za-z0-9+/])rO0AB[A-Za-z0-9+/]{4}|(?i)(?:^|[^a-f0-9])aced0005(?:7[0-9a-f]|[0-9a-f]{4})" "id:5006007,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,multiMatch,severity:CRITICAL,msg:'Java serialization stream in a request field',setvar:tx.inbound_anomaly_score_pl1=+5"

# Non-HTTP fetch protocols and ambiguous numeric/userinfo authorities need no
# DNS lookup. Approved normal HTTPS destinations belong in a site API contract.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:^|[\s\x22'])(?:dict|gopher|file|jar|netdoc|ldap|rmi)://|https?://(?:[^/\s]*@|0x[0-9a-f]+(?:[/:]|$)|[0-9]{8,}(?:[/:]|$)|0[0-7]+\.)" "id:5006008,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Unsafe fetch protocol or ambiguous URL authority',setvar:tx.inbound_anomaly_score_pl1=+5"

# XPath 2+ comments are whitespace, can nest, and can separate an operator from
# its function. Detect the structural prefix without recursively parsing them.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)[\x22']\s*(?:(?:or|and)[\s(]*)?\(:" "id:5006009,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'XPath comment obfuscation after a quote',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?:[;|&`\n\r]|\$\()\s*(?:\$\{IFS\}|[a-zA-Z]+\$\{[a-zA-Z_][a-zA-Z_0-9]*\}[a-zA-Z]+|[a-zA-Z]+(?:[\x22']{2}[a-zA-Z]+)+)" "id:5006010,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Obfuscated shell command spelling',setvar:tx.inbound_anomaly_score_pl1=+5"

# Paths only an attacker asks for: an exploit's entry point, or what an exploit leaves behind. PHPUnit's eval-stdin.php
# (CVE-2017-9841); PHP run from WordPress's uploads, cache or upgrade folders, including a second extension or path info
# after it (caching plugins keep PHP files in cache/ for PHP to include, not for visitors to fetch); the File
# Manager connectors (CVE-2020-25213) and anything PHP in its files folder; Slider Revolution's update folder; well-known
# web shells by name. A site that has none of these answers 404 anyway.
SecRule REQUEST_FILENAME "@rx /src/util/php/eval-stdin\.php|/wp-content/(?:uploads|cache|upgrade)/.*\.ph(?:p[0-9]?|tml?|ar|ps|t)(?:[/;.:\s]|$)|/wp-content/plugins/wp-file-manager/lib/(?:php/connector\.(?:minimal|standalone)\.php|files/.*\.ph(?:p[0-9]?|tml?|ar|ps|t)(?:[/;.:\s]|$))|/revslider/temp/update_extract/|/(?:c99|r57|wso|b374k)\.php(?:[/;.:\s]|$)" "id:5006011,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Exploit or web shell path',setvar:tx.inbound_anomaly_score_pl1=+5"
