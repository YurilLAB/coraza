# SPDX-License-Identifier: Apache-2.0
# Local supplement, NOT part of the signed upstream CRS release. Run before CRS's
# anomaly evaluation, after its score initialization (also for multiphase builds).
# Decode only for matching: never rewrite the request.
# ARGS already has one transport decoding layer. Two more passes cover nested
# escapes, with multiMatch checking the original and each transformed value.
# XML scalars use the same signatures. Ordinary prose/URLs alone are not attacks.

SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)[\x22'][\s)]*(?:or|and)[\s(]*[a-z_][a-z0-9_.:-]*\s*\(" "id:5006001,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'XPath predicate injection syntax',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx [\x22']\s*\]\s*\|\s*/|\|\s*//[^\s|]+\s*\|\s*//" "id:5006002,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'XPath union injection syntax',setvar:tx.inbound_anomaly_score_pl1=+5"

# Shell punctuation plus a command, rather than blocking punctuation by itself.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:[;|\n\r`]|&&|\$\()\s*(?:/[^\s;|`]*\/)?(?:i[\x22']*d|w[\x22']*h[\x22']*o[\x22']*a[\x22']*m[\x22']*i|uname|cat|curl|wget|bash|sh|powershell|pwsh|cmd(?:\.exe)?|nslookup|ping|sleep|printf|echo|ls|env|python[0-9.]*|perl|ruby|nc|netcat)(?:[\s;|`)&]|$)" "id:5006003,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Shell command chaining or substitution',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:^|[\s;|&])(?:cmd(?:\.exe)?\s+/[ck]\s|(?:powershell|pwsh)(?:\.exe)?\s+-(?:enc(?:odedcommand)?|command|c)\s)" "id:5006004,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Command interpreter invocation',setvar:tx.inbound_anomaly_score_pl1=+5"

SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:\{\{|[$#*]\{|<%=)[\s(]*(?:[0-9]+\s*[*+/\-]\s*[0-9]+|config\s*(?:\}\}|[.(])|[^\r\n]*(?:__class__|__globals__|__mro__|__subclasses__|getclass\s*\(|freemarker\.template\.utility\.Execute|java\.lang\.Runtime))" "id:5006005,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Server template expression injection',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:^|[/\\]|%(?:25)*(?:2f|5c))(?:\.|%(?:25)*2e){2}(?:[/\\]|%(?:25)*(?:2f|5c))" "id:5006006,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,multiMatch,severity:CRITICAL,msg:'Nested-encoded parent path traversal',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?:^|[^A-Za-z0-9+/])rO0AB[A-Za-z0-9+/]{4}|(?i)(?:^|[^a-f0-9])aced0005(?:7[0-9a-f]|[0-9a-f]{4})" "id:5006007,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,multiMatch,severity:CRITICAL,msg:'Java serialization stream in a request field',setvar:tx.inbound_anomaly_score_pl1=+5"

# Non-HTTP fetch protocols and ambiguous numeric/userinfo authorities need no
# DNS lookup. Approved normal HTTPS destinations belong in a site API contract.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)(?:^|[\s\x22'])(?:dict|gopher|file|jar|netdoc|ldap|rmi)://|https?://(?:[^/\s]*@|0x[0-9a-f]+(?:[/:]|$)|[0-9]{8,}(?:[/:]|$)|0[0-7]+\.)" "id:5006008,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Unsafe fetch protocol or ambiguous URL authority',setvar:tx.inbound_anomaly_score_pl1=+5"

# XPath 2+ comments are whitespace, can nest, and can separate an operator from
# its function. Detect the structural prefix without recursively parsing them.
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?i)[\x22']\s*(?:(?:or|and)[\s(]*)?\(:" "id:5006009,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'XPath comment obfuscation after a quote',setvar:tx.inbound_anomaly_score_pl1=+5"
SecRule ARGS|XML:/*|XML://@*|REQUEST_COOKIES "@rx (?:[;|&`\n\r]|\$\()\s*(?:\$\{IFS\}|[a-zA-Z]+\$\{[a-zA-Z_][a-zA-Z_0-9]*\}[a-zA-Z]+|[a-zA-Z]+(?:[\x22']{2}[a-zA-Z]+)+)" "id:5006010,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,multiMatch,severity:CRITICAL,msg:'Obfuscated shell command spelling',setvar:tx.inbound_anomaly_score_pl1=+5"

# Paths only an attacker asks for: an exploit's entry point, or what an exploit leaves behind. PHPUnit's eval-stdin.php
# (CVE-2017-9841); PHP run from WordPress's uploads, cache or upgrade folders, including a second extension or path info
# after it (caching plugins keep PHP files in cache/ for PHP to include, not for visitors to fetch); the File
# Manager connectors (CVE-2020-25213) and anything PHP in its files folder; Slider Revolution's update folder; Laravel
# Ignition's execute-solution (CVE-2021-3129); well-known web shells by name. A site that has none of these answers 404
# anyway.
SecRule REQUEST_FILENAME "@rx /src/util/php/eval-stdin\.php|/wp-content/(?:uploads|cache|upgrade)/.*\.ph(?:p[0-9]?|tml?|ar|ps|t)(?:[/;.:\s]|$)|/wp-content/plugins/wp-file-manager/lib/(?:php/connector\.(?:minimal|standalone)\.php|files/.*\.ph(?:p[0-9]?|tml?|ar|ps|t)(?:[/;.:\s]|$))|/revslider/temp/update_extract/|/_ignition/execute-solution(?:[/;.\s]|$)|/(?:c99|r57|wso|b374k)\.php(?:[/;.:\s]|$)" "id:5006011,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Exploit or web shell path',setvar:tx.inbound_anomaly_score_pl1=+5"

# Debug and diagnostic interfaces that hold secrets or run code, and have no business facing the internet: Spring Boot's
# actuator endpoints other than health, info and metrics (also behind a path parameter, which Tomcat drops), Jolokia,
# Go's pprof and expvar, Apache's server-status and server-info (which take a proxy on the same machine for a local
# visitor), the Symfony profiler and Yii's debug module. -local-rules-off 5006012 lets a site serve one on purpose.
SecRule REQUEST_FILENAME "@rx /actuator(?:;[^/]*)?/(?:env|configprops|heapdump|threaddump|jolokia|gateway|logfile|shutdown|restart|refresh|httptrace|httpexchanges|trace|loggers)(?:[/;.\s]|$)|/jolokia(?:[/;.\s]|$)|/debug/(?:pprof|vars)(?:[/;.\s]|$)|/server-(?:status|info)(?:[/;.\s]|$)|/_profiler(?:[/;.\s]|$)|/debug/default/(?:view|index|toolbar|db-explain)(?:[/;.\s]|$)" "id:5006012,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Debug or diagnostic interface',setvar:tx.inbound_anomaly_score_pl1=+5"

# Installers: on a site that is set up they have nothing to do, and on one that is not, whoever reaches them first owns
# it. WordPress's install.php and setup-config.php, Joomla's installation folder and Drupal's install.php.
# -local-rules-off 5006013 while installing through the edge.
SecRule REQUEST_FILENAME "@rx /wp-admin/(?:install|setup-config)\.php(?:[/;.:\s]|$)|/installation/index\.php(?:[/;.:\s]|$)|/core/install\.php(?:[/;.:\s]|$)" "id:5006013,phase:1,pass,log,t:none,t:utf8toUnicode,t:urlDecodeUni,t:normalizePathWin,t:lowercase,severity:CRITICAL,msg:'Web application installer',setvar:tx.inbound_anomaly_score_pl1=+5"

# Scanners the CRS list leaves out, by the user agent they send by default.
SecRule REQUEST_HEADERS:User-Agent "@pm dirsearch jaeles" "id:5006014,phase:1,pass,log,t:none,t:lowercase,severity:CRITICAL,msg:'Scanner user agent',setvar:tx.inbound_anomaly_score_pl1=+5"

# Remote file inclusion, where a URL to another host has no ordinary reason to be. Each URL's host is kept under a key of
# its own and compared with the request's Host, so a repeated parameter cannot hide one URL behind another, and a link to
# this site or one of its subdomains passes.
# A URL of any scheme, or a // or \\ path, in a parameter named like a file to include, a page to load or a template.
SecRule ARGS:/(?i)(?:^|\.)(?:page|file|filename|filepath|path|include|inc|require|module|mod|template|tpl|dir|folder|doc|document|root|lang|language|layout|theme|skin|style|conf|config|load|pg)(?:\[[^\]]*\]|\.[0-9]+)*$/ "@rx ^\s*(?:[a-z][a-z0-9+.\-]*:)?(?://|\\\\)(?:[^/@?#\\\s]*@)?([a-z0-9\-.]*|\[[0-9a-f:.]+\])(?::[0-9]*)?(?:[/\\?#]|$)" "id:5006015,phase:2,pass,log,capture,t:none,t:lowercase,severity:CRITICAL,msg:'Remote file reference in an include parameter',setvar:tx.carnical_rfi_include_n=+1,setvar:'tx.carnical_rfi_include_%{tx.carnical_rfi_include_n}=.%{tx.1}',chain"
    SecRule TX:/^carnical_rfi_include_[0-9]+$/ "!@endsWith .%{request_headers.host}" "t:none,setvar:tx.inbound_anomaly_score_pl1=+5"
# FTP, SMB or SSH addresses, and // or \\ paths that name a host, in any parameter: what PHP's include and other fetchers
# accept, and an ordinary link does not use.
SecRule ARGS|XML:/*|XML://@* "@rx ^\s*(?:(?:ftps?|smb|ssh2(?:\.[a-z]+)?):)?(?://|\\\\)(?:[^/@?#\\\s]*@)?([a-z0-9][a-z0-9\-]*(?:\.[a-z0-9\-]+)+|\[[0-9a-f:.]+\])(?::[0-9]*)?(?:[/\\?#]|$)" "id:5006016,phase:2,pass,log,capture,t:none,t:lowercase,severity:CRITICAL,msg:'FTP, SMB or scheme-less reference to another host',setvar:tx.carnical_rfi_bare_n=+1,setvar:'tx.carnical_rfi_bare_%{tx.carnical_rfi_bare_n}=.%{tx.1}',chain"
    SecRule TX:/^carnical_rfi_bare_[0-9]+$/ "!@endsWith .%{request_headers.host}" "t:none,setvar:tx.inbound_anomaly_score_pl1=+5"
# A web URL to a text or include file on another host: how remote file inclusion serves PHP without running it first.
SecRule ARGS|XML:/*|XML://@* "@rx ^\s*https?://(?:[^/@?#\\\s]*@)?([a-z0-9][a-z0-9\-]*(?:\.[a-z0-9\-]+)+|\[[0-9a-f:.]+\])(?::[0-9]*)?/[^?#\s]*\.(?:txt|inc)(?:[?#]|$)" "id:5006017,phase:2,pass,log,capture,t:none,t:lowercase,severity:CRITICAL,msg:'Remote text or include file URL',setvar:tx.carnical_rfi_text_n=+1,setvar:'tx.carnical_rfi_text_%{tx.carnical_rfi_text_n}=.%{tx.1}',chain"
    SecRule TX:/^carnical_rfi_text_[0-9]+$/ "!@endsWith .%{request_headers.host}" "t:none,setvar:tx.inbound_anomaly_score_pl1=+5"
