# Kernel settings that stop the usual steps from "code running as a service user" to "root".
# Install as /etc/sysctl.d/90-carnical.conf and run `sysctl --system`. carnical-audit checks that they are in force
# (audit/host/baseline.go holds the same values and a test keeps the two in step).
#
# What each one stops, and what it can break, is in deploy/README.md. Keys that only some kernels have are marked optional
# in the baseline; an unknown key here is ignored by sysctl --system.

# Another process of the same user cannot ptrace this one or read its memory: 2 is "only with CAP_SYS_PTRACE".
kernel.yama.ptrace_scope = 2
# Kernel addresses and messages are not shown to an unprivileged user: they are what an exploit needs to be reliable.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# The BPF interface and the performance counters are a large attack surface that a server does not use.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.perf_event_paranoid = 3
# io_uring has been behind many local privilege escalations: switch it off for everyone.
kernel.io_uring_disabled = 2
# A new kernel cannot be loaded over the running one, and the magic SysRq key does nothing.
kernel.kexec_load_disabled = 1
kernel.sysrq = 0
kernel.randomize_va_space = 2
# User namespaces are where most kernel exploits start: an unprivileged user can no longer make one. Nothing here runs
# rootless containers. (Debian and Ubuntu name the switch differently; each is ignored where it does not exist.)
user.max_user_namespaces = 0
kernel.unprivileged_userns_clone = 0
kernel.apparmor_restrict_unprivileged_userns = 1

# Symbolic and hard links, FIFOs and regular files in sticky directories cannot be used to trick a service into writing
# somewhere else, and a program that crashes does not leave a core file with keys in it.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0
vm.mmap_min_addr = 65536
vm.unprivileged_userfaultfd = 0

# Network: no spoofed sources, no redirects, no source routing; log what looks forged.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# And every interface's own copy: for these the kernel also uses the interface's value (the larger one, for rp_filter), a
# network card that existed before this file was applied keeps its own, and systemd's 50-default.conf sets every interface's
# rp_filter to 2, the loose mode. systemd-sysctl also applies these to each interface that appears later.
net.ipv4.conf.*.rp_filter = 1
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
# TCP Fast Open connects from sendto(2), without the connect(2) that Landlock's port rules are checked on, so a confined
# process could reach a port it was not given (the edge's system call filter refuses it as well). Nothing here uses it.
net.ipv4.tcp_fastopen = 0
